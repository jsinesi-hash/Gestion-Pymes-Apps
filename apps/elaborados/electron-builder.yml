appId: com.gestionpymes.elaborados
productName: Heladería
# El exe real lo nombra electron-forge vía packagerConfig.executableName = 'elaborados'
# Debe coincidir con forge.config.ts.
executableName: elaborados
copyright: "Copyright © 2026"

# Toma la app ya empaquetada por electron-forge (--prepackaged)
# No re-bundlea — forge+vite ya generó el asar
directories:
  output: dist

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  # ASCII sin acentos ni espacios en el nombre del archivo del instalador.
  artifactName: "Heladeria-Setup-${version}.${ext}"
  shortcutName: "${productName}"
  uninstallDisplayName: "${productName}"
  createDesktopShortcut: always
  # La base de la heladería vive en userData: desinstalar NO debe borrarla (a diferencia del entorno de pruebas).
  deleteAppDataOnUninstall: false
  # Cierra la app antes de instalar/desinstalar
  include: scripts/nsis/custom.nsh

# El geo-cache viaja como extraResource de electron-forge (forge.config.ts): con --prepackaged
# electron-builder ignora extraResources.

# Excluir archivos de DB y WAL — viven en userData, nunca se distribuyen
files:
  - "!**/*.db"
  - "!**/*.db-wal"
  - "!**/*.db-shm"

# Módulo nativo fuera del asar (ya viene de forge, pero por si acaso)
asarUnpack:
  - "**/*.node"

# Sin firma de código, sin auto-update y sin publicación: instalación manual (ADR-111).
