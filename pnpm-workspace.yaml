packages:
  - 'packages/*'
  - 'apps/*'
nodeLinker: hoisted
verifyDepsBeforeRun: false
allowBuilds:
  esbuild: true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  "@electron/node-gyp": true
  "@electron/rebuild": true
onlyBuiltDependencies:
  - esbuild
  - better-sqlite3
  - electron
  - electron-winstaller
  - "@electron/node-gyp"
  - "@electron/rebuild"
blockExoticSubdeps: false
